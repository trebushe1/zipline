name: Patch tracker

# New Deadlock builds: read from Steam, announced in Telegram, published on the site,
# then before/after models and textures are added. Started by the live collector
# within seconds of a Steam app change; the schedule is only a fallback.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: patches
  cancel-in-progress: false

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GAMETRACKING_DIR: ${{ runner.temp }}/gametracking
      MEDIA_TOOLS_DIR: ${{ runner.temp }}/tools
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SteamDB's prebuilt SteamFileDownloader and Source2Viewer-CLI (~140 MB), kept between runs.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: steam-tools-v1

      - run: pip install -q pillow httpx

      - name: New build from Steam
        id: tracker
        continue-on-error: true
        run: python -m backend.tracker

      - name: Telegram alert
        run: python -m backend.build_alerts

      - name: Publish the summary
        run: scripts/publish_patches.sh "new Deadlock build summaries"

      - name: Builds from SteamDB's tracking repo
        id: steamdb
        continue-on-error: true
        run: python -m backend.patches

      - name: Models and textures (before / after)
        id: media
        continue-on-error: true
        run: python -m backend.media

      - name: Add the media line to Telegram alerts
        run: python -m backend.build_alerts --media

      - name: Publish models and textures
        run: scripts/publish_patches.sh "Deadlock build media"

      # Failed steps above let the rest finish; the run is still marked failed so GitHub emails about it.
      - name: Report failures
        if: steps.tracker.outcome == 'failure' || steps.media.outcome == 'failure'
        run: |
          echo "::error::tracker: ${{ steps.tracker.outcome }}, media: ${{ steps.media.outcome }}"
          exit 1
