name: Patch tracker

# Checks SteamDB's GameTracking-Deadlock for new Steam builds, writes readable
# summaries to data/patches/ and redeploys the site when something new appears.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: patches
  cancel-in-progress: false

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Summarise new builds
        run: python -m backend.patches
        env:
          GAMETRACKING_DIR: ${{ runner.temp }}/gametracking

      - name: Publish
        run: |
          git add data/patches
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "zipline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: new Deadlock build summaries"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            sleep 5
          done
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY"
