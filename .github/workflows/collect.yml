name: Collect dev messages & deploy

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub may run it later than scheduled under load
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/archive.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Poll Discord and build site
        run: python -m backend.static_build
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      - name: Save archive
        run: |
          git config user.name "zipline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m "data: new developer messages"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
