name: Shop items

# Items of the Curiosity Shop for the «Предметы» page: stats and text from the newest build,
# icons and Russian text from Steam (fetched only when the game's files changed).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [backend/items.py, .github/workflows/items.yml]
  schedule:
    - cron: "41 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: items
  cancel-in-progress: false

jobs:
  items:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
      STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install -q pillow
          echo "GAMETRACKING_DIR=$RUNNER_TEMP/gametracking" >> "$GITHUB_ENV"
          echo "MEDIA_TOOLS_DIR=/tmp/zipline/tools" >> "$GITHUB_ENV"

      # SteamDB's SteamFileDownloader and Source2Viewer-CLI, kept between runs.
      - uses: actions/cache@v4
        with:
          path: /tmp/zipline/tools
          key: items-tools-v1

      - name: Items
        run: python -m backend.items

      - name: Publish
        run: |
          git add data/items
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "zipline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: shop items"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            sleep 5
          done
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY"
